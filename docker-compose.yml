services:
  db:
    image: postgres:17-alpine
    container_name: shipit_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-shipit_development}
      TZ: Asia/Tokyo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - shipit_network

  minio:
    image: minio/minio:latest
    container_name: shipit_minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - shipit_network

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: shipit_api
    env_file:
      - ./backend/.env
    environment:
      RAILS_ENV: development
      RAILS_LOG_TO_STDOUT: "true"
      BUNDLE_DEPLOYMENT: "0"
      BUNDLE_WITHOUT: ""
    ports:
      - "3001:3001"
    volumes:
      - ./backend:/rails
      - bundle_cache:/usr/local/bundle
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    command: >
      bash -c "
        rm -f tmp/pids/server.pid &&
        bundle install &&
        bundle exec rails db:prepare &&
        bundle exec rails s -b 0.0.0.0 -p 3001
      "
    stdin_open: true
    tty: true
    networks:
      - shipit_network

volumes:
  postgres_data:
  minio_data:
  bundle_cache:

networks:
  shipit_network:
    driver: bridge
