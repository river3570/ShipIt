
services:
  # PostgreSQL Database
  db:
    image: postgres:17-alpine
    container_name: shipit_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-shipit_development}
      TZ: 'Asia/Tokyo'
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - shipit_network

  # MinIO (S3-compatible storage)
  minio:
    image: minio/minio:latest
    container_name: shipit_minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"  # API
      - "9001:9001"  # Web Console
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - shipit_network

  # Rails API Backend
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: shipit_api
    environment:
      DATABASE_HOST: db
      DATABASE_USER: ${POSTGRES_USER:-postgres}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DATABASE_NAME: ${POSTGRES_DB:-shipit_development}
      RAILS_ENV: development
      RAILS_LOG_TO_STDOUT: 'true'
      # MinIO settings
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      AWS_REGION: us-east-1
      AWS_ENDPOINT: http://minio:9000
      AWS_BUCKET: shipit-dev
      # CORS - ローカルのNext.jsを許可
      FRONTEND_URL: http://localhost:3000
    ports:
      - "3001:3001"
    volumes:
      - ./backend:/app
      - bundle_cache:/usr/local/bundle
      - ./backend/tmp:/app/tmp
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    command: >
      bash -c "
        rm -f tmp/pids/server.pid &&
        bundle install &&
        bundle exec rails db:prepare &&
        bundle exec rails s -b 0.0.0.0 -p 3001
      "
    stdin_open: true
    tty: true
    networks:
      - shipit_network

volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local
  bundle_cache:
    driver: local

networks:
  shipit_network:
    driver: bridge
